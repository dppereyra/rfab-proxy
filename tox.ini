[tox]
minversion = 4.64.0
isolated_build = true
skip_missing_interpreters = true
env_list =
  py314,
  py315,
  lint,
  security,
  complexity,
  deadcode,
  openapi,
  lock,

[testenv]
# tox-uv installs from uv.lock (uv sync --locked); the lock is the truth.
runner = uv-venv-lock-runner
extras =
  dev
commands =
  pytest --cov --cov-report=term --cov-report=xml

[testenv:py314]
basepython = python3.14

[testenv:py315]
basepython = python3.15

[testenv:lint]
commands = flake8 src tests

[testenv:security]
commands = bandit -r src

[testenv:complexity]
commands =
  radon cc --total-average --no-assert src tests
  radon mi --show src tests
  radon hal src tests

[testenv:deadcode]
commands = vulture --min-confidence 75 src

[testenv:openapi]
commands = openapi-spec-validator src/rfab_proxy/openapi.yaml

[testenv:lock]
# Fails when pyproject.toml and uv.lock disagree.
runner = virtualenv
skip_install = true
allowlist_externals = uv
commands = uv lock --check


[pytest]
addopts = -rA
testpaths =
  tests
python_files =
  tests-*.py


[coverage:run]
branch = true
source =
  rfab_proxy


[coverage:report]
show_missing = true
skip_covered = false
precision = 0
fail_under = 90


[coverage:xml]
# Read by SonarCloud in CI.
output = coverage.xml


[coverage:html]
directory = htmlcov


[flake8]
statistics      = true
tee             = true
max-complexity  = 8
max-line-length = 99
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .history,
    .venv,
    .tox,
    dist,
    build,
