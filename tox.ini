[tox]
minversion = 4.64.0
isolated_build = true
skip_missing_interpreters = true
env_list =
  py314,
  py315,
  lock,

[testenv]
# tox-uv installs from uv.lock (uv sync --locked); the lock is the truth.
runner = uv-venv-lock-runner
extras =
  dev
commands =
  pytest

[testenv:py314]
basepython = python3.14

[testenv:py315]
basepython = python3.15

[testenv:lock]
# Fails when pyproject.toml and uv.lock disagree.
runner = virtualenv
skip_install = true
allowlist_externals = uv
commands = uv lock --check


[pytest]
addopts = -rA
testpaths =
  tests
python_files =
  tests-*.py
