name: Feature request
description: Suggest an improvement or new capability for rfab-proxy.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please agree on the change in this issue before writing code: pull
        requests without an accepted issue are closed automatically. To ask for a new common API
        (such as the Ollama API), use the **Common API support** form instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need rather than the solution, e.g. "I can't ... because ...".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like rfab-proxy to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "No"
        - Yes, once the approach is agreed here
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been proposed.
          required: true
