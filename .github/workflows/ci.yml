name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the pipx:tox pin in mise.toml.
  TOX_VERSION: "4.64.9"
  TOX_UV_VERSION: "1.36.1"

jobs:
  versions:
    # mise.toml is the single source of truth for the Python matrix and the
    # uv version; every other job reads them from here.
    name: Read tool versions
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.versions.outputs.python }}
      default-python: ${{ steps.versions.outputs.default-python }}
      uv: ${{ steps.versions.outputs.uv }}
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The task only needs the runner's python3, not the pinned toolchain.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
      - id: versions
        run: |
          mise run --quiet ci:versions > versions.json
          {
            echo "python=$(jq -c .python versions.json)"
            echo "default-python=$(jq -r '.python[0].python' versions.json)"
            echo "uv=$(jq -r .uv versions.json)"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Check ${{ matrix.toxenv }}
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toxenv:
          - lint
          - security
          - complexity
          - deadcode
          - openapi
          - lock
    steps:
      # hatch-vcs derives the version from git history, so tags are required.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.default-python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ needs.versions.outputs.uv }}
      - run: uv tool install "tox==${TOX_VERSION}" --with "tox-uv==${TOX_UV_VERSION}"
      - run: tox -e ${{ matrix.toxenv }}

  test:
    name: Run tests on Python ${{ matrix.python }}
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # allow-prereleases lets setup-python install 3.15 before 3.15.0 ships.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ needs.versions.outputs.uv }}
      - run: uv tool install "tox==${TOX_VERSION}" --with "tox-uv==${TOX_UV_VERSION}"
      - run: tox -e ${{ matrix.toxenv }}
      - name: Keep the coverage report for SonarCloud
        if: matrix.python == needs.versions.outputs.default-python
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  trivy:
    # Vulnerabilities in uv.lock, misconfiguration, and committed secrets.
    # Any finding fails the job; there is no ignore file by design.
    name: Trivy scan
    runs-on: ubuntu-24.04
    env:
      TRIVY_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "1"

  sonarcloud:
    name: SonarCloud analysis
    needs: test
    runs-on: ubuntu-24.04
    env:
      # Absent on forks and until the SonarCloud project is set up; the scan
      # is skipped rather than failed in that case.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      - name: Report a skipped scan
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; SonarCloud analysis skipped."

  ci:
    # Single required status check: matrix job names change whenever the
    # matrix does, this one does not.
    name: CI
    runs-on: ubuntu-24.04
    needs:
      - versions
      - quality
      - test
      - trivy
      - sonarcloud
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
