name: Require a linked issue

# Pull requests must link an open issue in this repository with a closing
# keyword (see .github/CONTRIBUTING.md); anything else is closed with a comment.
# pull_request_target is needed so the token can comment on and close pull
# requests from forks. It is safe here because the job never checks out or
# runs code from the pull request, and pull request data only reaches the
# shell through environment variables.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linked-issue:
    name: Linked issue
    # The maintainer tracks work outside GitHub issues; Dependabot opens its own PRs.
    if: >-
      github.event.pull_request.state == 'open'
      && github.event.pull_request.user.login != 'dppereyra'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Close the pull request unless it links an open issue
        run: |
          # shellcheck disable=SC2016  # $owner etc. are GraphQL variables, not shell
          linked=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 10) {
                    nodes { state repository { nameWithOwner } }
                  }
                }
              }
            }' \
            -F owner="$OWNER" -F name="$REPO" -F number="$NUMBER" \
            --jq "[.data.repository.pullRequest.closingIssuesReferences.nodes[]
                   | select(.state == \"OPEN\" and .repository.nameWithOwner == \"$OWNER/$REPO\")]
                  | length")

          if [ "$linked" -gt 0 ]; then
            echo "Linked to $linked open issue(s)."
            exit 0
          fi

          gh pr close "$NUMBER" --repo "$OWNER/$REPO" --comment "Thanks for the pull request! It doesn't link an open issue in this repository, so it has been closed automatically.

          Every pull request needs a matching issue: open or find one, then open a new pull request whose description links it with a closing keyword such as \`Closes #123\`. See [CONTRIBUTING.md](https://github.com/$OWNER/$REPO/blob/master/.github/CONTRIBUTING.md)."
          echo "::notice::Closed: no linked open issue."
