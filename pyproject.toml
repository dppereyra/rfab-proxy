[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
    "hatch-vcs",
]

[project]
name = "rfab-proxy"
description = "HTTP proxy service built on Falcon"
requires-python = ">=3.14"
authors = [
  {name = "Dennis Philippe Pereyra Jr.", email = "mail@dppereyra.com"},
  {name = "DPPereyra"}
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "falcon>=4.4,<5",
    "uvicorn[standard]>=0.54,<0.55",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "bandit~=1.9.4",
    "flake8~=7.4.1",
    "pytest>=9.1,<9.2",
    "pytest-cov>=7.1,<7.2",
    "radon~=6.0.1",
    "vulture~=2.16",
]

[project.scripts]
rfab-proxy = "rfab_proxy.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rfab_proxy"]

[tool.hatch.envs.default]
type = "virtual"
features = ["dev"]
installer = "uv"

# Local convenience only; tox (tox.ini) is the canonical runner and these mirror it.
[tool.hatch.envs.default.scripts]
tests = "pytest --cov"
linter = "flake8 src tests"
complexity = [
  "radon cc --total-average --no-assert src tests",
  "radon mi --show src tests",
  "radon hal src tests"
]
deadcode = "vulture --min-confidence 75 src"
security = "bandit -r src"
