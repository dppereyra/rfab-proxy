[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
    "hatch-vcs",
]

[project]
name = "rfab-proxy"
description = "HTTP proxy service built on Falcon"
requires-python = ">=3.14"
authors = [
  {name = "Dennis Philippe Pereyra Jr.", email = "mail@dppereyra.com"},
  {name = "DPPereyra"}
]
readme = "README.md"
dynamic = ["version"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<9.2",
    "pytest-cov>=7.1,<7.2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rfab_proxy"]

[tool.hatch.envs.default]
type = "virtual"
features = ["dev"]
installer = "uv"

# Local convenience only; tox (tox.ini) is the canonical runner and these mirror it.
[tool.hatch.envs.default.scripts]
tests = "pytest --cov"
