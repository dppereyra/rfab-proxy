# Development tool versions for rfab-proxy. `mise install` sets them all up.
# CI reads the Python matrix and the uv version from this file (`mise run ci:versions`).

[tools]
# The first entry is the default `python`; python3.15 is also put on PATH so
# tox can run both py314 and py315 locally. 3.15 is pinned exactly while it is
# a pre-release (mise can't resolve the "3.15" prefix until 3.15.0 ships);
# CI only uses the major.minor part.
python = ["3.14", "3.15.0rc3"]
uv = "0.12.23"
# Keep in step with the tox / tox-uv pins in .github/workflows/ci.yml.
"pipx:tox" = { version = "4.64.9", uvx_args = "--with tox-uv==1.36.1" }
trivy = "0.75.0"
helm = "4.3.0"
"pipx:mkdocs" = "1.6.1"

[tasks."ci:versions"]
description = "Print the CI Python matrix and uv version as JSON"
run = "python3 scripts/ci_versions.py mise.toml"

# Short aliases for the tox envs; tox stays the canonical runner.
[tasks.tox]
description = "Run every tox env"
run = "tox"

[tasks.test]
description = "Run the test suite on every Python version"
run = "tox -e py314,py315"

[tasks.lint]
description = "Run flake8, radon and vulture"
run = "tox -e lint,complexity,deadcode"

[tasks.security]
description = "Run bandit and a local Trivy scan"
run = [
  "tox -e security",
  "trivy fs --scanners vuln,misconfig,secret --disable-telemetry --skip-dirs .venv --skip-dirs .tox --exit-code 1 .",
]
